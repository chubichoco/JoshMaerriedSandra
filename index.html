<div class="stage">

  <!-- PAGE 0 — envelope -->
  <section id="page-0" class="screen envelope-screen">
    <p class="eyebrow">you&rsquo;ve got mail from</p>
    <h1 class="display-names">Josh &amp; Sandra</h1>

    <button type="button" id="envelope" class="envelope" aria-label="Tap envelope to open your invitation">
      <img id="envelope-img" class="envelope-img" src="assets/envelope-closed.png" alt="" />
      <video id="envelope-video" class="envelope-video" src="assets/envelope-open.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
    </button>

    <p class="cta-label">tap envelope to open</p>
  </section>

  <!-- PAGE 1 — invitation -->
  <section id="page-1" class="screen invitation-screen">
    <div class="floral floral-inv-tl" aria-hidden="true">

    </div>
    <div class="floral floral-inv-br" aria-hidden="true">
      <svg viewBox="0 0 120 120"><use href="#sprig"/></svg>
    </div>

    <button type="button" id="go-back" class="go-back">&lsaquo; go back</button>

    <div class="invitation-scroll">
      <div class="rsvp-wrap">
        <img class="floral-corner" src="assets/floral-corner-tr.png" alt="" aria-hidden="true" />
        <div class="rsvp-envelope">
          <img src="assets/opened-envelope-clean.png?v=2" alt="" />
        </div>
        <div class="rsvp-letter-pop">
          <a class="rsvp-letter" id="rsvp-letter" data-rsvp-href="https://docs.google.com/forms/d/1N4yijdkmJqS4JCAT8HbmVimhJuXdrWXO6EnhLT2mRJM" aria-label="RSVP — click here if you can make it">
            <span class="rsvp-letter-flip">
              <span class="rsvp-letter-face rsvp-letter-front">
                <img src="assets/date-to-remember-tilted.png" alt="A Date to Remember" />
              </span>
              <span class="rsvp-letter-face rsvp-letter-back">
                <span class="rsvp-letter-back-text">Click here if<br />you can make it!</span>
              </span>
            </span>
          </a>
        </div>
        <a class="details-badge" href="#page-2" aria-label="View wedding details">
          <img src="assets/details-heart.png" alt="" />
        </a>
        <div class="polaroid-strip" aria-hidden="true">
          <img src="assets/wed-1.jpg" alt="" />
          <img src="assets/wed-2.jpg?v=2" alt="" />
          <img src="assets/wed-3.jpg" alt="" />
        </div>
        <img class="locket" src="assets/locket-clean.png" alt="" aria-hidden="true" />
      </div>

      <button type="button" id="song-disc" class="disc-wrap" aria-label="Play our song">
        <div class="disc-outer">
          <div class="disc-spin"></div>
          <div class="disc-bevel"></div>
          <div class="disc-label">
            <span class="disc-letter">J</span>
            <svg class="disc-heart" viewBox="0 0 24 22" aria-hidden="true"><path d="M12 20.5C12 20.5 1.6 13.9 1.6 7.6 1.6 4.2 4.2 1.8 7.2 1.8c2 0 3.8 1.1 4.8 2.9 1-1.8 2.8-2.9 4.8-2.9 3 0 5.6 2.4 5.6 5.8C22.4 13.9 12 20.5 12 20.5Z"/></svg>
            <span class="disc-letter">S</span>
          </div>
        </div>
        <img class="disc-flowers" src="assets/disc-flowers-left.png" alt="" aria-hidden="true" />
        <svg class="disc-caption" viewBox="0 0 560 520" aria-hidden="true">
          <defs><path id="discArc" d="M 334 441 A 218 218 0 0 0 483 305" fill="none"/></defs>
          <text font-family="Cormorant Garamond, Georgia, serif" font-size="21" letter-spacing="4.5" fill="#3a2523" text-anchor="middle">
            <textPath href="#discArc" startOffset="50%">TAP TO PLAY</textPath>
          </text>
        </svg>
      </button>

      <p class="date-line">10 april 2027</p>
      <p class="venue-line">St Clements Church, Iloilo City</p>

      <div class="countdown" id="countdown" aria-live="polite">
        <p class="countdown-eyebrow">Our forever begins in</p>
        <div class="countdown-numbers">
          <span class="countdown-num" id="cd-days">00</span><span class="countdown-colon">:</span>
          <span class="countdown-num" id="cd-hours">00</span><span class="countdown-colon">:</span>
          <span class="countdown-num" id="cd-mins">00</span><span class="countdown-colon">:</span>
          <span class="countdown-num" id="cd-secs">00</span>
        </div>
        <div class="countdown-labels">
          <span>days</span><span>hours</span><span>minutes</span><span>seconds</span>
        </div>
      </div>

      <p class="with-love">with love,</p>
      <p class="closing-names">Josh &amp; Sandra</p>
    </div>
    <audio id="song-audio" src="assets/our-song.mp3" preload="auto"></audio>
  </section>
