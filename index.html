<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Josh &amp; Sandra — 10 April 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Parisienne&family=Jost:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="stage">

  <!-- PAGE 0 — envelope -->
  <section id="page-0" class="screen envelope-screen">
    <p class="eyebrow">you&rsquo;ve got mail from</p>
    <h1 class="display-names">Josh &amp; Sandra</h1>

    <button type="button" id="envelope" class="envelope" aria-label="Tap envelope to open your invitation">
      <img id="envelope-img" class="envelope-img" src="assets/envelope-closed.png" alt="" />
      <div class="paper" id="paper" aria-hidden="true"></div>
    </button>

    <p class="cta-label">tap envelope to open</p>
  </section>

  <!-- PAGE 1 — invitation -->
  <section id="page-1" class="screen invitation-screen">
    <div class="floral floral-inv-tl" aria-hidden="true">
      <svg viewBox="0 0 120 120"><use href="#sprig"/></svg>
    </div>
    <div class="floral floral-inv-br" aria-hidden="true">
      <svg viewBox="0 0 120 120"><use href="#sprig"/></svg>
    </div>

    <button type="button" id="go-back" class="go-back">&lsaquo; go back</button>

    <div class="invitation-scroll">
      <div class="rsvp-wrap">
        <a class="rsvp-card" href="https://docs.google.com/forms/d/1N4yijdkmJqS4JCAT8HbmVimhJuXdrWXO6EnhLT2mRJM" target="_blank" rel="noopener">
          <img src="assets/rsvp-card.png" alt="Kindly RSVP — click here" />
        </a>
        <div class="polaroid-strip" aria-hidden="true">
          <img src="assets/wed-1.jpg" alt="" />
          <img src="assets/wed-2.jpg" alt="" />
          <img src="assets/wed-3.jpg" alt="" />
        </div>
      </div>

      <p class="date-line">10 april 2027</p>
      <p class="venue-line">St Clements Church, Iloilo City</p>

      <div class="countdown" id="countdown" aria-live="polite">
        <p class="countdown-eyebrow">the countdown is on!</p>
        <div class="countdown-numbers">
          <span class="countdown-num" id="cd-days">00</span><span class="countdown-colon">:</span>
          <span class="countdown-num" id="cd-hours">00</span><span class="countdown-colon">:</span>
          <span class="countdown-num" id="cd-mins">00</span><span class="countdown-colon">:</span>
          <span class="countdown-num" id="cd-secs">00</span>
        </div>
        <div class="countdown-labels">
          <span>days</span><span>hours</span><span>minutes</span><span>seconds</span>
        </div>
      </div>

      <p class="with-love">with love</p>
      <p class="closing-names">Josh &amp; Sandra</p>
    </div>
  </section>

</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="sprig">
      <path d="M60 110 C58 90 55 70 50 50 C46 34 38 20 24 10" fill="none" stroke="#5F6B47" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="46" cy="46" rx="10" ry="5" transform="rotate(-40 46 46)" fill="#5F6B47"/>
      <ellipse cx="36" cy="30" rx="9" ry="4.5" transform="rotate(-55 36 30)" fill="#B8935A" opacity="0.85"/>
      <ellipse cx="24" cy="14" rx="8" ry="4" transform="rotate(-70 24 14)" fill="#D9A9A4"/>
      <ellipse cx="54" cy="66" rx="9" ry="4.5" transform="rotate(-25 54 66)" fill="#D9A9A4"/>
      <circle cx="20" cy="10" r="4" fill="#6E2A35"/>
    </g>
  </defs>
</svg>

<script src="script.js"></script>
</body>
</html>
